name: Auto Update Zeus Proxies

on:
  schedule:
    - cron: '0 */3 * * *' # اجرا هر ۳ ساعت یک‌بار
  workflow_dispatch:      # امکان اجرا با یک کلیک دستی

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # اجازه به گیت‌هاب برای ذخیره تغییرات
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python update.py
      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update active proxies [skip ci]" && git push)
